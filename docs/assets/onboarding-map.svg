<svg viewBox="0 0 680 340" width="100%" role="img" xmlns="http://www.w3.org/2000/svg">
<title>Onboarding — Day One to First Merge</title>
<desc>The onboarding path for a new contributor: read the index, run setup, check the glossary, then make a first change through the four gates.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<text class="th" x="340" y="30" text-anchor="middle" fill="#B5D4F4" font-size="15" font-weight="500">Onboarding — Day One to First Merge</text>

<g class="c-blue">
<rect x="40" y="60" width="120" height="56" rx="8" fill="#042C53" stroke="#185FA5" stroke-width="0.5"/>
<text class="th" x="100" y="82" text-anchor="middle" fill="#B5D4F4" font-size="13" font-weight="500">1. Read</text>
<text class="ts" x="100" y="100" text-anchor="middle" fill="#85B7EB" font-size="12">docs/README.md</text>
</g>

<path d="M160 88 L200 88" fill="none" stroke="#185FA5" stroke-width="1.5" marker-end="url(#arrow)"/>

<g class="c-blue">
<rect x="210" y="60" width="120" height="56" rx="8" fill="#042C53" stroke="#185FA5" stroke-width="0.5"/>
<text class="th" x="270" y="82" text-anchor="middle" fill="#B5D4F4" font-size="13" font-weight="500">2. Setup</text>
<text class="ts" x="270" y="100" text-anchor="middle" fill="#85B7EB" font-size="12">Clone → dev server</text>
</g>

<path d="M330 88 L370 88" fill="none" stroke="#185FA5" stroke-width="1.5" marker-end="url(#arrow)"/>

<g class="c-blue">
<rect x="380" y="60" width="120" height="56" rx="8" fill="#042C53" stroke="#185FA5" stroke-width="0.5"/>
<text class="th" x="440" y="82" text-anchor="middle" fill="#B5D4F4" font-size="13" font-weight="500">3. Glossary</text>
<text class="ts" x="440" y="100" text-anchor="middle" fill="#85B7EB" font-size="12">Local vocabulary</text>
</g>

<path d="M440 116 L440 150" fill="none" stroke="#185FA5" stroke-width="1.5" marker-end="url(#arrow)"/>

<g class="c-teal">
<rect x="340" y="160" width="200" height="56" rx="8" fill="#04342C" stroke="#0F6E56" stroke-width="0.5"/>
<text class="th" x="440" y="182" text-anchor="middle" fill="#9FE1CB" font-size="13" font-weight="500">4. First Change</text>
<text class="ts" x="440" y="200" text-anchor="middle" fill="#5DCAA5" font-size="12">Branch → change → gates → commit</text>
</g>

<path d="M440 216 L440 250" fill="none" stroke="#5DCAA5" stroke-width="1.5" marker-end="url(#arrow)"/>

<g class="c-green">
<rect x="300" y="260" width="280" height="56" rx="8" fill="#173404" stroke="#3B6D11" stroke-width="0.5"/>
<text class="th" x="440" y="282" text-anchor="middle" fill="#C0DD97" font-size="13" font-weight="500">The Four Gates</text>
<text class="ts" x="440" y="300" text-anchor="middle" fill="#97C459" font-size="12">Type check → Lint → Build → Test</text>
</g>

<text class="ts" x="340" y="330" text-anchor="middle" fill="#888780" font-size="11">Every change passes all four. CI runs the same four on every pull request.</text>
</svg>